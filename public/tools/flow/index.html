<!DOCTYPE html>
<!-- 路径: public/flow/index.html （节点工作台 · /flow/） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>节点工作台 · OwnChat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.59/dist/drawflow.min.css" />
<script src="/shared/lib/escape.js"></script>
<script>
  /* 主题跟随:与主站同源(cfw_theme_v1 / my-theme),首屏前应用避免闪烁(令牌见 /shared/core/theme.css?v=4) */
  (function(){try{
    var t=localStorage.getItem("cfw_theme_v1")||"minimal";
    if(t&&t!=="minimal")document.documentElement.setAttribute("data-theme",t);
    var s=localStorage.getItem("my-theme");
    if(s==="light"||s==="dark")document.documentElement.setAttribute("data-scheme",s);
  }catch(e){}})();
</script>
<link rel="stylesheet" href="/shared/core/theme.css?v=4" />
<script src="/services/data/chat-stream.js"></script>
<style>
  /* 主题令牌已抽到 /shared/core/theme.css?v=4（公共底座），此处不再重复定义 :root */
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { display:flex; align-items:center; gap:12px; padding:9px 16px; border-bottom:1px solid var(--border); background:var(--panel); flex:none; }
  .brand { font-weight:700; font-size:15px; letter-spacing:.01em; }
  .brand small { color:var(--muted); font-weight:400; font-size:12px; margin-left:8px; }
  .tb-spacer { flex:1; }
  .count { font-size:12px; color:var(--muted); }
  .btn { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:9px; border:1px solid var(--border); background:rgba(127,127,127,.08); color:var(--text); font:inherit; font-size:13px; font-weight:500; cursor:pointer; transition:background-color 100ms cubic-bezier(.2,.7,.3,1),border-color 100ms cubic-bezier(.2,.7,.3,1),color 100ms cubic-bezier(.2,.7,.3,1); }
  .btn:hover { background:rgba(127,127,127,.13); border-color:var(--border-hi); }
  .btn:active { transform:scale(.98); }
  .btn svg { width:16px; height:16px; }
  .btn.primary { background:var(--ac); border-color:var(--ac); color:var(--ac-contrast); font-weight:600; }
  .btn.primary:hover { background:var(--ac-strong); border-color:var(--ac-strong); }
  .btn[disabled] { opacity:.45; cursor:default; }
  .top-link { color:var(--text); text-decoration:none; font-size:13px; font-weight:500; padding:0 12px; height:34px; display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:9px; background:rgba(127,127,127,.08); transition:background-color 100ms cubic-bezier(.2,.7,.3,1),border-color 100ms cubic-bezier(.2,.7,.3,1); }
  .top-link:hover { color:var(--text); background:rgba(127,127,127,.13); border-color:var(--border-hi); }
  .top-link:active { transform:scale(.98); }
  .workspace { flex:1; display:flex; min-height:0; }
  .palette-pane { width:208px; flex:none; border-right:1px solid var(--border); background:var(--panel); overflow-y:auto; padding:12px 10px; }
  .pal-hint { font-size:11px; line-height:1.6; color:var(--muted); background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin-bottom:12px; }
  .pal-group { margin-bottom:16px; }
  .pal-title { font-size:11px; font-weight:600; color:var(--muted); margin:0 2px 8px; }
  .pal-item { display:flex; align-items:center; width:100%; height:34px; text-align:left; padding:0 10px; margin-bottom:4px; border-radius:9px; border:1px solid var(--border); background:rgba(127,127,127,.08); color:var(--text); font:inherit; font-size:13px; cursor:pointer; transition:background-color 100ms cubic-bezier(.2,.7,.3,1),border-color 100ms cubic-bezier(.2,.7,.3,1); }
  .pal-item:hover { background:rgba(127,127,127,.13); border-color:var(--border-hi); }
  .pal-item:active { transform:scale(.98); }
  .canvas-pane { flex:1; position:relative; min-width:0; }
  #canvas { position:absolute; inset:0; }
  .cdn-warn { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:none; max-width:340px; text-align:center; color:var(--muted); font-size:13px; line-height:1.7; background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
  .console-pane { position:relative; flex:none; height:172px; min-height:120px; border-top:1px solid var(--border); background:var(--panel); display:flex; flex-direction:column; }
  .console-resize { height:7px; flex:none; cursor:row-resize; background:transparent; }
  .console-resize:hover, .console-resize:active { background:var(--ac-soft); }
  .console-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); }
  .console-tabs { display:flex; gap:3px; height:34px; padding:3px; border-radius:10px; background:var(--seg-track,rgba(127,127,127,.10)); box-shadow:var(--seg-track-shadow,none); }
  .console-tab { background:transparent; border:none; color:var(--muted); font:inherit; font-size:12px; font-weight:600; height:26px; padding:0 10px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:background-color 100ms cubic-bezier(.2,.7,.3,1),color 100ms cubic-bezier(.2,.7,.3,1); }
  .console-tab:hover { color:var(--text); }
  .console-tab.active { background:var(--seg-active-fill,var(--ac-soft)); color:var(--seg-active-fg,var(--text)); box-shadow:var(--seg-active-shadow,none); }
  .art-count { display:inline-block; min-width:16px; text-align:center; padding:0 5px; border-radius:999px; background:var(--ac-soft); color:var(--ac-strong); font-size:11px; line-height:16px; }
  .console-actions { display:flex; gap:6px; }
  .console-head .btn { padding:0 10px; font-size:12px; }
  #console { flex:1; overflow-y:auto; padding:10px 14px; font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .log-line { white-space:pre-wrap; word-break:break-word; padding:1px 0; color:var(--text); }
  #artifacts { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:12px; }
  /* 修「输出台 / 产物 两个面板叠在一起」: #artifacts 的 display:flex 会盖过 [hidden] 属性自带的 display:none, 导致两块同时渲染重叠。显式让 [hidden] 生效, 任一时刻只显示一个。 */
  #console[hidden], #artifacts[hidden] { display:none !important; }
  .art-empty { color:var(--muted); font-size:12px; line-height:1.7; text-align:center; padding:18px 12px; }
  .art-card { border:1px solid var(--border); border-radius:10px; background:var(--panel2); overflow:hidden; }
  .art-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 10px 7px 12px; border-bottom:1px solid var(--border); }
  .art-info { display:flex; align-items:baseline; gap:8px; min-width:0; }
  .art-name { font-weight:600; font-size:12.5px; color:var(--text); word-break:break-all; }
  .art-meta { font-size:11px; color:var(--muted); flex:none; }
  .art-btns { display:flex; gap:6px; flex:none; }
  .art-btns .btn { padding:3px 10px; font-size:12px; }
  .art-code { margin:0; padding:10px 12px; max-height:320px; overflow:auto; font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre; color:var(--text); }
  .drawflow { background-color:var(--bg); background-image:radial-gradient(color-mix(in srgb,var(--text) 8%,transparent) 1px,transparent 1px); background-size:22px 22px; }
  .drawflow .drawflow-node { background:var(--panel); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:0; width:248px; box-shadow:none; }
  .drawflow .drawflow-node:hover { border-color:var(--border-hi); }
  .drawflow .drawflow-node.selected { border-color:var(--ac) !important; background:var(--panel) !important; box-shadow:none !important; }
  .drawflow .drawflow-node.selected .nd-head { color:var(--text); border-bottom-color:var(--border); }
  .drawflow .drawflow-node .input, .drawflow .drawflow-node .output { background:var(--panel); border:1px solid var(--border-hi); width:9px; height:9px; box-shadow:none; }
  .drawflow .connection .main-path { stroke:var(--border-hi); stroke-width:1.6px; }
  .nd { width:100%; }
  .nd-head { font-weight:600; padding:9px 12px; border-bottom:1px solid var(--border); font-size:13px; }
  .nd-desc { font-size:11px; color:var(--muted); padding:8px 12px 0; line-height:1.5; }
  .nd-body { padding:8px 12px 10px; display:flex; flex-direction:column; gap:8px; }
  .nd-field { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); }
  .nd-field textarea, .nd-field input, .nd-field select { background:var(--input-bg); border:1px solid var(--input-border,var(--border)); border-radius:9px; color:var(--text); font:inherit; font-size:12px; padding:6px 8px; resize:vertical; }
  .nd-field textarea:focus, .nd-field input:focus, .nd-field select:focus { outline:none; border-color:var(--ac); box-shadow:0 0 0 3px var(--ac-soft); }
  .nd-out { font-size:11px; color:var(--ac); padding:0 12px 10px; word-break:break-word; }
  .nd-out:empty { display:none; }

  .pane-toggle { display:none; }
  /* —— 移动端适配（重构：顶栏换行 + 上下堆叠 + 节点面板可折叠 + 资金条独占一行） —— */
  @media (max-width: 720px) {
    .topbar { flex-wrap:nowrap; justify-content:flex-start; gap:8px; padding:8px 12px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .topbar::-webkit-scrollbar { display:none; }
    .topbar > * { flex:none; }
    .brand { font-size:14px; }
    .brand small { display:none; }
    .tb-spacer { display:none; }
    .count { display:none; }
    .btn { padding:6px 10px; }
    .top-link { padding:6px 8px; }
    .pane-toggle { display:inline-flex; }
    .workspace { flex-direction:column; }
    .palette-pane { width:100%; flex:none; max-height:28vh; border-right:none; border-bottom:1px solid var(--border); padding:10px; }
    body.palette-collapsed .palette-pane { display:none; }
    .canvas-pane { flex:1; min-height:240px; }
    .console-pane { height:140px; min-height:96px; }
    .drawflow .drawflow-node { width:206px; }
  }
</style>
<link rel="stylesheet" href="/shared/core/work-ui.css?v=4" />
</head>
<body class="palette-collapsed">
  <header class="topbar">
    <button class="btn pane-toggle" id="paneToggle" title="展开/收起节点面板" onclick="document.body.classList.toggle('palette-collapsed')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 256 256" width="18" height="18" fill="currentColor" stroke="currentColor" stroke-width="14" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M252 128a60 60 0 0 1-102.43 42.43l-.49-.53l-59.86-67.59a36 36 0 1 0 0 51.38l3.08-3.48a12 12 0 1 1 18 15.91l-3.35 3.78l-.49.53a60 60 0 1 1 0-84.86l.49.53l59.86 67.59a36 36 0 1 0 0-51.38l-3.08 3.48a12 12 0 1 1-18-15.91l3.35-3.78l.49-.53A60 60 0 0 1 252 128"/></svg></span>
    <span class="brand">节点工作台<small>节点式可视化工作流 · 不止于代码</small></span>
    <span class="tb-spacer"></span>
    <span class="count" id="saveState">节点工作流</span>
    <button class="btn primary" id="runBtn" title="按依赖顺序执行整张图">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5.5l12 6.5-12 6.5z"/></svg>运行
    </button>
    <button class="btn" id="stopBtn" hidden title="中止运行">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>停止
    </button>
    <button class="btn" id="saveBtn" title="保存到本地">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5.5h10l4 4V19a.5.5 0 0 1-.5.5H5A.5.5 0 0 1 4.5 19V6A.5.5 0 0 1 5 5.5z"/><path d="M8 5.5v4h6"/><path d="M8 19v-5h8v5"/></svg>保存
    </button>
    <button class="btn" id="clearBtn" title="清空画布">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6.5h15"/><path d="M9 6.5V5.2A1.7 1.7 0 0 1 10.7 3.5h2.6A1.7 1.7 0 0 1 15 5.2V6.5"/><path d="M6.8 6.5l.7 12.2a1.8 1.8 0 0 0 1.8 1.7h5.4a1.8 1.8 0 0 0 1.8-1.7l.7-12.2"/></svg>清空
    </button>
    <a class="top-link" href="/" title="返回主站">返回主站</a>
  </header>

  <div class="workspace">
    <aside class="palette-pane">
      <div class="pal-hint">点节点加到画布,拖端口连线成工作流。引擎与画布解耦:换一套节点包就是另一种工作流。</div>
      <div id="palette"></div>
    </aside>
    <main class="canvas-pane">
      <div id="canvas"></div>
      <div class="cdn-warn" id="cdnWarn">节点画布库(Drawflow)未能从 CDN 加载。请检查网络后刷新,或改用本地打包版。</div>
    </main>
  </div>

  <section class="console-pane" id="consolePane">
    <div class="console-resize" id="consoleResize" title="拖动上沿调整输出台高度"></div>
    <div class="console-head">
      <div class="console-tabs">
        <button class="console-tab active" id="tabLog" type="button">输出台</button>
        <button class="console-tab" id="tabArt" type="button">产物 <span class="art-count" id="artCount">0</span></button>
      </div>
      <div class="console-actions">
        <button class="btn" id="downloadAllBtn" type="button" hidden>下载全部</button>
        <button class="btn" id="clearLogBtn" type="button">清空日志</button>
      </div>
    </div>
    <div id="console"></div>
    <div id="artifacts" hidden></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.59/dist/drawflow.min.js"></script>
  <script src="/config.js"></script>
  <script src="/shared/lib/i18n.js"></script>
  <script src="/tools/flow/engine.js"></script>
  <script src="/tools/flow/nodes.js"></script>
  <script src="/tools/flow/canvas.js"></script>
  <script src="/tools/flow/help.js?v=2"></script>
</body>
</html>
