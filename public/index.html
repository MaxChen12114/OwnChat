<!DOCTYPE html>
<!-- 路径: public/index.html （酒馆主页 · 根 /） -->
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>OwnChat</title>
  <link rel="stylesheet" href="/styles.css?v=6" />
  <link rel="stylesheet" href="/styles-2.css" />
  <link rel="stylesheet" href="/styles-panel.css?v=29" />
  <!-- PWA: 可安装应用外壳(manifest + 各平台 meta);图标依赖 /assets/icon-192.png 与 icon-512.png -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#15161a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OwnChat" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="OwnChat —— 数据与密钥都留在你自己手里的 AI 创作平台：角色扮演、长文写作、代码协作、图像与语音，部署到你自己的 Cloudflare Workers。" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <!-- 2026-05-29: Settings 移动端字体协调修复 (克制裁减不折腾 styles.css) -->
  <style>
    @media (max-width: 640px) {
      #settings #settingsHeader h3 { font-size: 18px; margin: 0 0 4px; }
      #settings #settingsHeader .hint { font-size: 12px; line-height: 1.5; }
      #settings .card h4 { font-size: 15px; line-height: 1.4; font-weight: 600; letter-spacing: 0.01em; margin: 0 0 8px; }
      #settings .card p { font-size: 13px; line-height: 1.65; }
      #settings .card label { font-size: 13px; }
      #settings .card code { font-size: 11.5px; padding: 1px 5px; border-radius: 3px; }
      #settings .card .toggle label { font-size: 13px; }
      #settings .card .smallbtn { font-size: var(--ctl-fs, 12.5px); }
      /* 4.70: settings 手机端 flex-wrap 修复 */
      #settings .rowline { flex-wrap: wrap; gap: 8px; }
      #settings .toggle  { flex-wrap: wrap; }
      #settings .btns    { flex-wrap: wrap; gap: 6px; }
    }
    @media (min-width: 641px) {
    }
    /* 4.18 (fix): 独立 toggle 隐藏统计小字 (token/速度/累计费用) */
    /* styles.css 里 .hide-msg-actions 旧规则会一并隐 .stats,这里用 !important revert 拆开 */
    html.hide-msg-actions .stats { display: block !important; }
    html.hide-stats .stats { display: none !important; }
    /* 4.20: 顶栏组件可开关 - 实时资金按钮 #costDisplay 关闭后,topbar-spacer 自动吸收空隙紧凑剩余按钮 */
    html.hide-topbar-cost #costDisplay { display: none !important; }
    /* 2026-06-07 顶栏 emoji→线性 SVG:统一 #topbar 内 .iconbtn 的 SVG 尺寸,currentColor 随主题(集中一处,后续换图标只改 SVG 本身) */
    #topbar .iconbtn svg { width: 18px; height: 18px; display: block; }
    /* 2026-06-07 模式键(免费/快速)= 线性 SVG 图标 + 文字标签;手机端隐藏文字只留图标(顶栏瘦身),桌面端图标+文字 */
    #topbar #modeToggle { display: inline-flex; align-items: center; gap: 6px; }
    #topbar #modeToggle .btn-text { font-size: 13px; line-height: 1; }
    @media (max-width: 640px) { #topbar #modeToggle .btn-text { display: none; } }
    /* 2026-06-08 顶栏注入开关:原裸图标太隐晦 → 改「图标 + 文字标签」。桌面显示文字,手机端只留图标省空间 */
    #topbar #personaToggle { width: auto; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; }
    /* 2026-06-08 修复「顶栏开关仍是圆胶囊」: 注入开关/模式键 在 styles.css 里共享同一条 #topbar #personaToggle,#topbar #modeToggle 的 9px pill 规则, 但开关实测仍渲染成圆 —— 疑 styles.css 下半段残留一条更靠后/更高特异性的旧 #personaToggle 圆角规则(4.5「圆按钮形态」遗留 border-radius)按源序盖掉了 9px。本 head 内联块晚于 styles.css 加载, 用 !important 钉死 9px(含 .unlocked 态), 强制与模式键同款 pill; 根因清理留待 styles.css 全量同步时删那条旧规则。 */
    #topbar #personaToggle,
    html.unlocked #topbar #personaToggle { border-radius: 9px !important; }
    #topbar #personaToggle .btn-text { font-size: 13px; line-height: 1; }
    @media (max-width: 640px) { #topbar #personaToggle .btn-text { display: none; } #topbar #personaToggle { padding: 0; width: 38px; } }
    /* 2026-06-08 免费模式顶栏占位:免费 / 无消费时 #costDisplay 补占位文案,弱化显示填补中段空隙(item7) */
    #costDisplay.cost-placeholder { opacity: .5; }
    /* 2026-06-08 手机端开发者工具「更多」下拉:收纳 ⏸/🛠 dev 按钮,避免窄屏顶栏换行冲突(item6) */
    #topbarMoreMenu { position: absolute; z-index: 9999; flex-direction: column; gap: 6px; padding: 8px; border-radius: 12px; background: var(--bubble-ai, #161616); border: 1px solid var(--border, #2a2a2a); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    #topbarMoreMenu .iconbtn { width: auto; height: 34px; justify-content: flex-start; gap: 8px; padding: 6px 12px; }
    /* 思考过程折叠块:隐藏浏览器默认实心三角 marker,只用自定义 SVG 图标 */
    details.reasoning-block > summary { list-style: none; display: flex; align-items: center; gap: 4px; cursor: pointer; }
    details.reasoning-block > summary::marker { display: none; }
    details.reasoning-block > summary::-webkit-details-marker { display: none; }
    /* 4.38-ui: 思考按钮去 🧠 emoji,改简洁 sparkle 线性图标 + 文字;active 态紫色微光,与 send 的线性 SVG 风格统一 */
    #thinkToggle { display: inline-flex; align-items: center; gap: 5px; }
    #thinkToggle .think-ico { width: 15px; height: 15px; flex: none; opacity: .65; transition: opacity .15s, transform .15s, filter .15s, color .15s; }
    #thinkToggle:hover:not(:disabled) .think-ico { opacity: 1; }
    #thinkToggle.active .think-ico { opacity: 1; color: inherit; filter: drop-shadow(0 0 3px rgba(127,127,127,.45)); transform: scale(1.06); }
    #thinkToggle.active .think-label { color: inherit; }
    #thinkToggle:disabled .think-ico { opacity: .35; }
    /* 2026-09-12 修复:composerAttachBtn(回形针)错位 + 样式丑 —— 它只是个纯图标按钮,
       之前完全依赖通用 .chip-btn(为「图标+文字标签」按钮设计,如 #thinkToggle),
       缺文字标签时布局跟着错位。这里给它单独钉一个固定尺寸的居中方形图标按钮,
       与 sendBtn / thinkToggle 同一套设计语言(圆角、hover 反馈)。 */
    #composer #composerAttachBtn {
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto; width: 34px; height: 34px; padding: 0;
      border-radius: 9px; background: rgba(127,127,127,.08);
      border: 1px solid rgba(127,127,127,.22); color: inherit;
      opacity: .8; cursor: pointer;
      transition: background .15s, opacity .15s, border-color .15s;
    }
    #composer #composerAttachBtn:hover { opacity: 1; background: rgba(127,127,127,.16); }
    #composer #composerAttachBtn svg { width: 16px; height: 16px; display: block; }
    /* 2026-09-12 修复:思考按钮(#thinkToggle)是「图标+文字」pill(border-radius:999px,padding:6px 12px,无固定高度),
       实际渲染高度(~27px)矮于回形针按钮的固定 34px 方块 —— 底部对齐容器(.input-inner align-items:flex-end)下
       两键顶部就不齐,看起来「一个上一个下」。这里钉死同一 34px 高度 + 同款 9px 圆角,和回形针统一设计语言,
       不动全局 .chip-btn(其它用到该 class 的地方不受影响,仅 #composer 内的 #thinkToggle 生效)。 */
    #composer {
      align-items: center !important;
    }
    #composer #composerAttachBtn,
    #composer #thinkToggle {
      align-self: center !important;
      height: 34px;
      min-height: 34px;
      box-sizing: border-box;
    }
    #composer #thinkToggle {
      padding: 0 12px; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      flex: 0 0 auto;
      line-height: 1;
    }
    #composer #thinkToggle .think-label { line-height: 1; }
    /* 2026-09-12 修复:上面两条 34px 定尺寸对全部屏幕宽度生效,手机端相对输入框显得太大块。
       手机端(≤640px)统一降到 30px/8px 圆角,图标/文字同比缩小,桌面端不受影响。 */
    @media (max-width: 640px) {
      #composer #composerAttachBtn { width: 30px; height: 30px; border-radius: 8px; }
      #composer #composerAttachBtn svg { width: 15px; height: 15px; }
      #composer #thinkToggle { height: 30px; padding: 0 9px; border-radius: 8px; gap: 4px; }
      #composer #thinkToggle .think-ico { width: 13px; height: 13px; }
      /* 2026-09-12 手机端思考按钮瘦身:关闭时只显示 sparkle 图标;开启时按强度显示单字。
         原「图标 + 思考关/思考开」在窄屏 composer 里太占空间,还会挤压输入框。
         开启后不再写长文案,而是从按钮文本/title/aria 里识别 low/medium/high/auto 等强度:
         低/弱 →「低」,中/默认/auto →「中」,高/强 →「高」。识别不到强度则继续只显示图标。 */
      #composer #thinkToggle .think-label { font-size: 0; width: 0; overflow: hidden; }
      #composer #thinkToggle.active .think-label { width: 0; overflow: hidden; }
      #composer #thinkToggle.active .think-label::after { font-size: 12px; line-height: 1; }
      /* 用 JS 写入 data-mobile-effort,避免 title/aria 里同时含“高中低”导致 CSS 全部命中、最后总显示“高”。 */
      #composer #thinkToggle.active[data-mobile-effort="minimal"] .think-label,
      #composer #thinkToggle.active[data-mobile-effort="low"] .think-label,
      #composer #thinkToggle.active[data-mobile-effort="medium"] .think-label,
      #composer #thinkToggle.active[data-mobile-effort="high"] .think-label,
      #composer #thinkToggle.active[data-mobile-effort="xhigh"] .think-label,
      #composer #thinkToggle.active[data-mobile-effort="max"] .think-label { width: auto; overflow: visible; }
      #composer #thinkToggle.active[data-mobile-effort="minimal"] .think-label::after { content: "极低"; }
      #composer #thinkToggle.active[data-mobile-effort="low"] .think-label::after { content: "低"; }
      #composer #thinkToggle.active[data-mobile-effort="medium"] .think-label::after { content: "中"; }
      #composer #thinkToggle.active[data-mobile-effort="high"] .think-label::after { content: "高"; }
      #composer #thinkToggle.active[data-mobile-effort="xhigh"] .think-label::after { content: "更高"; }
      #composer #thinkToggle.active[data-mobile-effort="max"] .think-label::after { content: "最高"; }
      /* 模型不支持思考：手机端也露出「思考不可用」，否则只剩一个灰图标看不出原因 */
      #composer #thinkToggle:disabled .think-label { font-size: 11px; width: auto; overflow: visible; }
    }
    /* 4.39-ui: 左侧栏 + 移动 tab 图标统一为线性 SVG;用 currentColor 继承各主题文字色,无需维护多套图标 */
    .sidebar-btn-icon, .mobile-tab-icon { display: inline-flex; align-items: center; justify-content: center; }
    .sidebar-btn-icon svg { width: 18px; height: 18px; display: block; }
    .mobile-tab-icon svg { width: 22px; height: 22px; display: block; }
    .sidebar-btn-disabled .sidebar-btn-icon svg { opacity: .55; }
    /* 2026-09-14 UI第二轮:底栏视觉层已收敛进 styles-2.css 悬浮胶囊 dock(单一样式源);此处仅保留桌面硬隐藏。
       不写 #mobileBottomTabs 的 display/position/transform,避免盖过桌面隐藏与滚动隐藏逻辑 */
    /* 2026-09-13 fix: 手机底栏 DOM 在 .app-shell 外,桌面端必须硬隐藏,避免桌面底部出现占位条/手机按钮。 */
    /* 2026-11-08 修(审查 P0): 断点 769→1024,与 styles-2 移动布局(≤1023)和 agent IIFE 的
       isMobile()(≤1023)对齐 —— 旧版 769~1023 区间(平板竖窗/Tauri 窄窗)底栏被硬隐藏,
       而 styles-2 在该区间走移动布局,Agent 控制台挂进永久不可见的面板。 */
    @media (min-width: 1024px) {
      #mobileBottomTabs,
      .mobile-tab-panel {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    }
    /* 4.40-ui: 设置面板标题/按钮 emoji 换线性图标(currentColor 随主题,与左栏统一) */
    #settings .card h4 { display: flex; align-items: center; gap: 8px; }
    #settings .card h4 svg { width: 16px; height: 16px; flex: none; opacity: .85; }
    #settings .smallbtn { display: inline-flex; align-items: center; gap: 5px; }
    #settings .smallbtn svg { width: 13px; height: 13px; flex: none; }
    #settings #cloudExcludeSection > summary svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
    /* 4.41-ui: 右侧栏标签化(群聊控制台 / 图像),解决图像快捷面板挤占、遮挡多智能体控制台的问题 */
    /* 4.42-fix: 仅桌面让右栏 flex 纵向布局;移动端不写 #rightSidebar(ID) 规则,交回 styles.css 的 .right-sidebar 隐藏 + 鱼缸显隐控制。4.41 原无条件 #rightSidebar{display:flex} 因 ID 特异性盖过 styles.css 移动端 .right-sidebar{display:none},导致手机右栏常驻挡聊天 */
    /* 2026-10-06: #rightSidebar 不再自己写 background —— 旧写死 var(--bubble-ai) 是 ID 级规则,
       ID 特异性压过 styles-2.css 里 .left-sidebar,.right-sidebar 的玻璃/烛色主题底,
       导致右栏永远比左栏更透明(自定义背景图下尤其明显)。玻璃底/主题底统一由 styles-2.css 那条管。 */
    @media (min-width: 1024px) { #rightSidebar { display: flex; flex-direction: column; min-height: 0; position: relative; /* 2026-06-16: 让内部 #rsResizeHandle(position:absolute) 相对右栏定位，否则手柄会脱离流相对视口定位覆盖全页交互元素 */ } }
    /* 2026-06-16 极简主题右栏背景兜底：4.29 改白底后右栏失去独立背景规则，白字打在白底上导致按钮「消失」+全白；各分主题已有独立 background 覆盖此兜底 */
    #rightSidebar .rs-header { padding: 8px 8px 6px; }
    /* 2026-10-08: flex:1 1 auto —— .rs-header 是 flex 行，整行此前没有 flex → 一直按「内容宽」走
       （英文标签下内容宽 223 > 可用 199 → 第三个页签被裁）。加上 flex 后整行铺满右栏，
       内部三个页签（flex:1 + min-width:0）均分宽度、文字按需省略。 */
    #rightSidebar .rs-tabs { display: flex; gap: 3px; flex: 1 1 auto; min-width: 0; background: rgba(127,127,127,.10); border-radius: 10px; padding: 3px; }
    /* 2026-09-14 UI第二轮:三 tab 时右栏 240px 下每个仅 ~70px,原 gap6/padding8/12.5px 收不下「图标+两字」→ 文字被压成竖排。
       收紧间距字号 + nowrap 钉死单行;min-width:0 允许 flex 收缩但文字不换行(极端窄栏下图标先让位)。 */
    #rightSidebar .rs-tab { flex: 1; min-width: 0; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 7px 6px; border: none; border-radius: 8px; background: transparent; color: inherit; opacity: .58; cursor: pointer; transition: background .15s, opacity .15s, box-shadow .15s; }
    /* 2026-10-08: 省略号三件套补 min-width:0 —— 缺了它，flex 子项的 min-width:auto 会让文本
       撑住不缩，英文标签（Activity/Status 比两字中文宽得多）把三个页签顶成 min-content 宽度，
       整行溢出右栏、第三个页签被裁掉（英文模式实测：行宽 223 > 可用 199）。 */
    #rightSidebar .rs-tab > span:not(.rs-dot) { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #rightSidebar .rs-tab svg { width: 15px; height: 15px; flex: none; }
    #rightSidebar .rs-tab:hover { opacity: .85; }
    #rightSidebar .rs-tab.active { opacity: 1; background: var(--accent-soft, rgba(127,127,127,.22)); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    #rightSidebar .rs-tab .rs-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: none; }
    #rightSidebar .rs-tab.has-activity .rs-dot { display: inline-block; }
    /* 2026-10-08: 英文标签（Agent/Group/Image/Status）比两字中文宽 —— 在英文模式下收紧
       图标与留白，让三个页签都完整显示、不吃省略号。 */
    html.i18n-en #rightSidebar .rs-tabs { gap: 2px; }
    html.i18n-en #rightSidebar .rs-tab { font-size: 10.5px; gap: 2px; padding: 7px 2px; }
    #rightSidebar .rs-body { flex: 1; min-height: 0; display: flex; }
    #rightSidebar .rs-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 10px; }
    #rightSidebar .rs-panel[hidden] { display: none; }
    /* 2026-11-09(所有者裁定): 右栏保持「整栏向下滚、时间线一路增高」的原行为 ——
       不把面板收成定高内滚。群聊控制台只调 DOM 顺序(在时间线之上),高度不设限。 */
    #rightSidebar .rs-empty { font-size: var(--empty-fs, 12.5px); line-height: var(--empty-lh, 1.6); opacity: var(--empty-op, .6); text-align: center; padding: 18px 12px; }
    #rightSidebar #fishbowlSlot:not(:empty) + .rs-empty { display: none; }
    #rightSidebar #agentConsoleSlot:not(:empty) + .rs-empty { display: none; }   /* 活动栏的空态 */
    #rightSidebar .rs-panel .sidebar-slot-placeholder { padding: 0; border: none; background: none; text-align: left; color: inherit; min-height: 0; }
    /* 4.59: 群聊控制台「建群聊」入口(从左侧栏迁入);线性图标 + 双行文案,走主题变量 */
    #rightSidebar .rs-build-group { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; margin: 0 0 10px; padding: 10px 12px; border: 1px solid var(--border, #333); border-radius: 12px; background: rgba(127,127,127,.06); color: inherit; cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
    #rightSidebar .rs-build-group:hover { border-color: rgba(127,127,127,.55); background: rgba(127,127,127,.10); }
    #rightSidebar .rs-build-group .rs-build-group-ico { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex: none; border-radius: 9px; background: rgba(127,127,127,.14); color: inherit; }
    #rightSidebar .rs-build-group .rs-build-group-ico svg { width: 17px; height: 17px; display: block; }
    #rightSidebar .rs-build-group .rs-build-group-tx { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    #rightSidebar .rs-build-group .rs-build-group-tx b { font-size: 13px; font-weight: 600; }
    #rightSidebar .rs-build-group .rs-build-group-tx small { font-size: 11px; opacity: .6; line-height: 1.3; }
    /* 4.63-ui: Settings 规整 — 分组标题 + 桌面端统一字号(消除"一会大一会小") */
    #settings .settings-group-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #c8c8c8; opacity: .9; margin: 24px 4px 10px; }
    #settings .settings-group-title:first-of-type { margin-top: 4px; }
    #settings .card h4 { font-size: 15px; font-weight: 600; line-height: 1.4; letter-spacing: .01em; }
    #settings .card > p { font-size: 13px; line-height: 1.65; }
    #settings .card label { font-size: 13px; line-height: 1.5; }
    #settings .card .smallbtn { font-size: var(--ctl-fs, 12.5px); }
    /* 2026-06-08 设置面板规整 + 去 emoji:把散落的 💡/⚠️ 提示行统一为「线性 SVG 图标 + 文字」组件,字号·间距·颜色一致,消除"乱乱的"观感(与全站 SVG 图标语言对齐) */
    #settings .settings-tip, #settings .settings-warn { display: flex; align-items: flex-start; gap: 7px; font-size: 11px; line-height: 1.6; margin-top: 10px; }

       设置面板深度精修——行分隔 / 卡片 / 输入框 / 标题语法
       ─────────────────────────────────────── */
    /* rowline: 去掉虚线改实线分隔 + 减少上下间距 */
    #settings .rowline {
      border-top: 1px solid rgba(127,127,127,.1) !important;
      padding: 9px 0 3px;
    }
    #settings .rowline:first-of-type { border-top: none !important; padding-top: 3px; }
    /* 2026-10-04: 行内多项(长标签+下拉+按钮)在任意宽度都允许换行 —— 窄宽度时改为折行,
       不再把中文标签挤压成竖排字(原先只有手机端 ≤640px 有同规则,这里提升为全局兜底) */
    #settings .rowline { flex-wrap: wrap; }
    html[data-theme="glass"] #settings .rowline { border-top-color: rgba(15,30,60,.07) !important; }
    html[data-theme="candle"] #settings .rowline { border-top-color: rgba(217,168,104,.1) !important; }
    html[data-scheme="light"]:not([data-theme]) #settings .rowline { border-top-color: #ededeb !important; }

    /* 卡片左侧强调色条（hover 时出现）*/
    #settings .card { position: relative; overflow: hidden; }
    #settings .card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; border-radius: 0 2px 2px 0;
      background: rgba(127,127,127,.3); opacity: 0;
      transition: opacity .2s;
    }
    /* 左侧色条 hover 出现已移除 */

    /* 2026-10-04: 输入类控件统一底色 + 字体。各卡(自定义直连/候选池/自驱叙事/Agent/发图/技能/图像…)的
       内联样式普遍只写 background:transparent,玻璃主题下描边又是近白色 → 输入框整体"隐形"只剩裸文字。
       统一补浅灰底(所有主题都可见,与生成参数卡/定价卡一致),并让字体继承面板字体(此前落回 Arial)。
       !important 用于压过各卡内联的 transparent;不动 checkbox/radio/range/file(各有专用样式)。 */
    #settings input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]),
    #settings select,
    #settings textarea {
      background: rgba(127, 127, 127, .08) !important;
      font-family: inherit;
      color: inherit;
    }
    /* 说明框(.settings-tip)用的是同一种灰底,只靠底色输入框会和它"撞色"分不清 →
       给输入框一条固定中灰描边(所有主题都可见,明暗通吃),说明框保持无边框色块。
       描边只在非聚焦态生效(:not(:focus)) —— 聚焦高亮交还给上面的 focus 规则,
       本规则的 !important 不会把它压掉。 */
    #settings input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not(:focus),
    #settings select:not(:focus),
    #settings textarea:not(:focus) {
      border-color: rgba(127, 127, 127, .45) !important;
    }

    /* 输入框 focus 状态 */
    #settings input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):focus,
    #settings select:focus,
    #settings textarea:focus {
      outline: none;
      border-color: rgba(127,127,127,.55) !important;
      box-shadow: 0 0 0 3px rgba(127,127,127,.1) !important;
    }
    html[data-theme="glass"] #settings input:focus, html[data-theme="glass"] #settings select:focus, html[data-theme="glass"] #settings textarea:focus {
      border-color: #3f6f8f !important; box-shadow: 0 0 0 3px rgba(63,111,143,.14) !important;
    }
    html[data-theme="candle"] #settings input:focus, html[data-theme="candle"] #settings select:focus, html[data-theme="candle"] #settings textarea:focus {
      border-color: #d9a868 !important; box-shadow: 0 0 0 3px rgba(217,168,104,.15) !important;
    }

    /* 卡片内 select/number 输入框统一圈圆角 */
    #settings .card select,
    #settings .card input[type="number"] {
      border-radius: 8px; font-size: 13px;
      padding: 6px 10px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    /* settings 标题 h3 美化 */
    #settingsHeader h3 {
      font-size: 16px !important; font-weight: 700 !important;
      letter-spacing: -.01em !important;
    }

    /* 分组标题左色条颜色跟主题绑定 */
    html[data-theme="glass"] #settings .settings-group-title::before { background: #3f6f8f; }
    html[data-theme="candle"] #settings .settings-group-title::before { background: #d9a868; }

    /* btns 排列 wrap 对齐 */
    #settings .btns { align-items: center; flex-wrap: wrap; }

    /* 最终关闭按鈕简洁化 */
    #settingsFooter { margin-top: 14px !important; padding-top: 12px !important; }

    /* 2026-09-12 Android App 设置面板滚动终版兜底：
       Android WebView 对「遮罩内固定面板 + 内层滚动」容易吞手势；网页端已正常，所以 App 端改成最稳的遮罩层滚动。
       #settingsMask 负责整页上下滚动，#settings 不再自己截断/嵌套滚动；分类栏继续 sticky 在面板顶部。 */
    @media (max-width: 768px) {
      html.android-app #settingsMask {
        position: fixed !important;
        inset: 0 !important;
        align-items: flex-start !important;
        justify-content: center !important;
        box-sizing: border-box !important;
        padding-top: calc(max(env(safe-area-inset-top), 42px) + 12px) !important;
        padding-bottom: calc(env(safe-area-inset-bottom) + 18px) !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        -webkit-overflow-scrolling: touch !important;
        overscroll-behavior: contain !important;
        touch-action: pan-y pan-x !important;
      }
      html.android-app #settings {
        display: block !important;
        width: min(760px, 94vw) !important;
        height: auto !important;
        max-height: none !important;
        min-height: 0 !important;
        overflow: visible !important;
        box-sizing: border-box !important;
        margin: 0 auto !important;
      }
      html.android-app #settings .settings-shell,
      html.android-app #settings .settings-cat-body {
        display: block !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      html.android-app #settings .settings-cat-nav {
        position: static !important;
        top: auto !important;
        z-index: auto !important;
        overflow-x: auto !important;
        overflow-y: hidden !important;
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-x pan-y !important;
      }
      html.android-app #settings .set-cat.active {
        min-height: 0 !important;
      }
    }

  </style>
</head>
<body>
<!-- 4.3 双侧栏布局:.app-shell grid 包左侧栏 + #app(中) + 右侧栏 -->
<!-- 桌面 ≥1024px:三列 240/auto/240 常驻;手机 <1024px:左栏变 ☰ 抽屉,右栏隐藏 -->
<div class="app-shell">

      </span>

           (注:旧版这里是清空全部历史的假按钮;会话系统重做后新建入口统一收敛到「对话」列表顶部) -->
      <button class="sidebar-btn" id="multiAgentToggle" title="单人 / 多人场景模式。多人模式下:角色面板出现「场景成员」管理区,卡库出现 +场景 按钮;输入框上方出现发言者选择条;AI 看到其他角色的发言但只代表自己。">
        <span class="sidebar-btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="2.7"/><path d="M3.5 18.5a5.5 5.5 0 0 1 11 0"/><path d="M16 6.2a2.7 2.7 0 0 1 0 5.2"/><path d="M17 13.2a5.5 5.5 0 0 1 3.5 5.3"/></svg></span>
        <span class="sidebar-btn-label">多智能体</span>
      </button>
      <!-- 4.69 Agent 模式:从顶栏移至左侧栏「模式」分区,与多智能体并列(互斥);顶栏空间有限,放侧栏语义也更清晰 -->
      <button class="sidebar-btn" id="agentModeBtn" title="Agent 模式：接入 AgentKernel 工具链，AI 自主调用工具解决复杂任务（与多智能体互斥）">
        <span class="sidebar-btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M9 11V7a3 3 0 0 1 6 0v4"/><circle cx="12" cy="16" r="1.2"/></svg></span>
        <span class="sidebar-btn-label">Agent 模式</span>
      </button>

      <!-- ══ 工作台:独立工作页,新标签打开,不影响主聊天 ══ -->
      <div class="sidebar-section-title" id="toolsPageSection">工作台</div>
      <!-- 工作台入口由 public/tools/<id>/tool.json 在构建期汇总（l0/build.mjs 扫描 → #toolsPageCatalog），
           本处只留容器；没有 tool.json 的目录不产生入口，全部没有则整段隐藏（boot/tools-pages.js 渲染） -->

      <div class="sidebar-divider"></div>
      <!-- ══ 资源 & 设置:内容 / 外观 / 数据,按需打开 ══ -->

        <span class="sidebar-btn-label">角色卡</span>
      </button>






      <!-- 4.7 提示词编辑器入口（原名「解限编辑器」，2026-10-06 改名）：动态注入提示词的编辑壳 —— 指令模块 / 角色 / 设定集三个页签。
           名字里不再带「解限」：解限是「底座」的职责（设置·解限底座），这个编辑器只是编辑注入内容。
           2026-10-06 入口改全局：去掉 data-nsfw（原锁定态被藏掉，被误认为入口丢失）。编辑器内容自带锁态/解锁态两套注册，功能安全。 -->
      <button class="sidebar-btn" id="promptEditorBtn" title="提示词编辑器：编辑 / 导入 指令模块 / 角色 / 设定集的 JSON 资产（SillyTavern 兼容导入）">
        <span class="sidebar-btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 7L3.5 12l5 5"/><path d="M15.5 7l5 5-5 5"/></svg></span>

      <div class="sidebar-divider"></div>
      <!-- 2026-06-06 桌面版下载入口:指向 GitHub Releases 最新版页,GitHub 自动展示当版 NSIS .exe;放侧栏底部与 GitHub 同组。注:tauri-action 安装包文件名带版本号,故指向 /releases/latest 页,而非某个固定文件名直链(后者发新版会 404) -->

  <!-- 抽屉遮罩(仅手机可见) -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <!-- ══ 中间:原 #app 块不动(仅顶栏 markup 重写) ══ -->
  <div id="app">
    <div id="topbar">
      <div class="topbar-shell">
        <div class="topbar-scroll" id="topbarScroll">
          <div class="topbar-inner">

            <!-- ☰ 抽屉切换(仅手机):手机点它打开左侧抽屉 -->

            <span class="topbar-spacer"></span>

            <!-- 2026-11-14 顶栏「工作 / 角色扮演」一级模式（原 2026-10-09 的「内置/自定义」提示词注入开关）:
                 点一下在两条意图轴之间切:工作=promptProfile assist(不吃 Layer2 角色状态层)+稳档温度;
                 角色扮演=全套 RP 层,回复风格与生成参数全交给设置。
                 两个旧能力都还在,只是降级进设置:基座目录 → 设置·对话「基座目录」卡;
                 内置提示词注入 → 设置·对话「网页自定义人物模板」卡的 #useBuiltinToggle。 -->
            <!-- app.js 已绑定 #personaToggle 事件（_appMode.bind）,DOM 仅换位,不动逻辑(图标 + 文字标签) -->
            <!-- 初始内容留空,交由 app.js 按当前模式渲染,避免静态 emoji 先显示后被脚本替换造成的跳变 -->
            <button class="iconbtn" id="personaToggle" title="角色扮演：完整角色层（状态 / 关系 / 氛围）（点击切到工作）" aria-label="当前角色扮演，点击切到工作"></button>
