name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case ("I want to…", "It's annoying when…"), not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work? Sketches / mockups welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Existing workarounds, similar features in other tools, etc.
