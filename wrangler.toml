name = "ownchat"
main = "src/worker.js"
compatibility_date = "2026-03-11"

# 构建步骤：扫 src/prompts/bases/ 生成基座注册表（改基座文件后自动生效），再跑一道真语法门。
[build]
command = "node scripts/gen-prompts.mjs && node scripts/check-syntax.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
# 这些前缀必须先进 worker 才有机会处理（API / 动态 config / 旧书签重定向 / 工具页）
run_worker_first = ["/api/*", "/config.js", "/write", "/write/*", "/coding", "/coding/*", "/flow", "/flow/*", "/studio", "/studio/*", "/audio", "/audio/*", "/image", "/image/*"]

# 云同步用的 KV。两条路二选一：
#   · 一键部署（Deploy 按钮）：它会读取这里的占位 id，并在部署时自动创建同名 namespace 后回填；
#   · 手动部署：wrangler kv namespace create TAVERN_SYNC，把打印的 id 填到这里。
# 不配也能跑：KV 只服务可选的云同步，聊天本身不依赖它。
[[kv_namespaces]]
binding = "TAVERN_SYNC"
id = "<在这里填 wrangler kv namespace create 打印出来的 id>"
